name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic tests (run on the Mac)
        run: |
          set -o pipefail
          mkdir -p ci-out
          swiftc -O -o logictests Logic/*.swift Tests/main.swift 2>&1 | tee logic-build.log
          ./logictests ci-out 2>&1 | tee ci-out/logic-tests.txt
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Aimframe.xcodeproj -target Aimframe -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -n -E "error:|BUILD FAILED" build.log | head -100 || true
      - name: Check icon and bundle
        run: |
          APP=build/Release-iphoneos/Aimframe.app
          plutil -p "$APP/Info.plist" | grep -i -A4 icon || true
          ls "$APP" | grep -i -E "AppIcon|Assets.car" || true
      - name: Launch in the simulator
        continue-on-error: true
        timeout-minutes: 20
        run: ./ci/launch.sh ci-out 2>&1 | tee ci-out/launch.txt
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Aimframe.app Payload/
          zip -r Aimframe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Aimframe-ipa
          path: Aimframe.ipa
      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Aimframe.ipa --title "Aimframe (ultima build)" --notes "Build ${{ github.sha }}" --target "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Publish test renders
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls ci-out || true
          gh release delete ci-renders --yes --cleanup-tag || true
          gh release create ci-renders ci-out/* --prerelease --title "CI renders" --notes "Test renders for ${{ github.sha }} (${{ github.ref_name }})" --target "${{ github.sha }}" || true
